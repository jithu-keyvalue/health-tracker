<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Health Tracker</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #007bff;
      color: white;
      padding: 15px;
    }

    .navbar h2 {
      margin: 0;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .navbar div {
      display: flex;
      gap: 10px;
    }

    .navbar button {
      padding: 10px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      background: #0056b3;
      color: white;
      cursor: pointer;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .header-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
      gap: 10px;
    }

    .header-actions {
      margin: 20px 0;
      text-align: right;
    }

    .header-actions button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 10px;
    }

    .header-actions button:hover {
      background-color: #0056b3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
    }

    th, td {
      padding: 12px;
      border: 1px solid #ccc;
      text-align: left;
    }

    th {
      background-color: #eaeaea;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.4);
    }

    .modal-content {
      background-color: white;
      margin: 10% auto;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      border-radius: 8px;
    }

    .modal-content input,
    .modal-content select,
    .modal-content button {
      width: 100%;
      margin: 8px 0;
      padding: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    .close {
      float: right;
      font-size: 24px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <h2 onclick="window.location.href='/home.html'">Health Tracker</h2>
    <div>
      <button onclick="window.location.href='/profile.html'">Profile</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="header-actions">
      <button onclick="openAddModal()">Add Observation</button>
      <button onclick="openUploadModal()">Upload Report</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Metric</th>
          <th>Value</th>
        </tr>
      </thead>
      <tbody id="list">
        <!-- Data goes here -->
      </tbody>
    </table>
  </div>

  <!-- Add Observation Modal -->
  <div id="addModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeAddModal()">&times;</span>
      <h3>Add Observation</h3>
      <label>Metric</label>
      <select id="metric">
        <option value="hb">Hb</option>
        <option value="cholesterol">Cholesterol</option>
        <option value="blood_sugar">Blood Sugar</option>
      </select>

      <label>Date</label>
      <input type="date" id="obs-date" />

      <label>Value</label>
      <input type="number" step="0.1" id="obs-value" />

      <button onclick="submitObservation()">Save</button>
    </div>
  </div>

  <!-- Upload Report Modal -->
  <div id="uploadModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeUploadModal()">&times;</span>
      <h3>Upload Lab Report</h3>

      <label>Select File</label>
      <input type="file" id="report-file" accept=".pdf" />

      <button onclick="submitUpload()">Upload</button>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 1000;"></div>

  <script>
    const API = "http://localhost:8000/v1";
    const token = localStorage.getItem("token");

    function logout() {
      localStorage.removeItem("token");
      window.location.href = "/index.html";
    }

    function showToast(message, type = "info") {
      const toast = document.createElement("div");
      toast.style.cssText = `
        padding: 12px 20px;
        margin-bottom: 10px;
        border-radius: 4px;
        color: white;
        font-weight: 500;
        min-width: 250px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        background: ${type === "success" ? "#4CAF50" : type === "error" ? "#f44336" : "#2196F3"};
        opacity: 0;
        transform: translateX(100%);
        transition: all 0.3s ease;
      `;
      
      toast.textContent = message;
      document.getElementById("toast-container").appendChild(toast);
      
      // Animate in
      setTimeout(() => {
        toast.style.opacity = "1";
        toast.style.transform = "translateX(0)";
      }, 100);
      
      // Auto remove after 3 seconds
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateX(100%)";
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function connectSSE() {
      const eventSource = new EventSource(`${API}/notifications/stream?token=${token}`);

      eventSource.onopen = function(event) {
        console.log("SSE connection opened successfully");
      };

      eventSource.onmessage = function(event) {
        const notification = JSON.parse(event.data);
        console.log("Received notification:", notification);
        
        // Don't show heartbeat messages as toasts
        if (notification.type !== 'heartbeat') {
          showToast(notification.message, notification.type);
          
          // Refresh table when file processing succeeds
          if (notification.type === 'success') {
            load();
          }
        }
      };

      eventSource.onerror = function(event) {
        console.log("SSE connection error:", event);
        console.log("EventSource readyState:", eventSource.readyState);
        // Reconnect after 5 seconds
        setTimeout(connectSSE, 5000);
      };
    }

    function openAddModal() {
      document.getElementById("addModal").style.display = "block";
    }

    function closeAddModal() {
      document.getElementById("addModal").style.display = "none";
    }

    async function submitObservation() {
      const metric = document.getElementById("metric").value;
      const date = document.getElementById("obs-date").value;
      const value = parseFloat(document.getElementById("obs-value").value);

      const res = await fetch(`${API}/observations/`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ metric, date, value })
      });

      if (res.ok) {
        closeAddModal();
        load();
      } else {
        alert("Failed to save");
      }
    }

    function openUploadModal() {
      document.getElementById("uploadModal").style.display = "block";
    }

    function closeUploadModal() {
      document.getElementById("uploadModal").style.display = "none";
    }

    async function submitUpload() {
      const fileInput = document.getElementById("report-file");

      if (!fileInput.files.length) {
        alert("Please select file");
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      const res = await fetch(`${API}/files/upload`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${token}` },
        body: formData
      });

      if (res.ok) {
        closeUploadModal();
        load();
        showToast("File uploaded successfully! Processing...", "info");
      } else {
        alert("Upload failed");
      }
    }

    async function load() {
      const res = await fetch(`${API}/observations/`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await res.json();
      const list = document.getElementById("list");
      list.innerHTML = "";

      data.forEach(obs => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${obs.date}</td>
          <td>${obs.metric}</td>
          <td>${obs.value}</td>
        `;
        list.appendChild(row);
      });
    }

    // Initialize SSE connection and load data
    connectSSE();
    load();
  </script>
</body>
</html>
