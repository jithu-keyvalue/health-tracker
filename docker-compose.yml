services:
  db:
    image: postgres:15
    container_name: health-db
    restart: always
    ports:
      - "5434:5432"
    env_file:
      - docker.env
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis
    ports:
      - 6379:6379

  worker:
    image: python:3.10
    container_name: health-worker
    command: sh -c "pip install -r requirements.txt && celery -A app.tasks.process_file worker --loglevel=info"
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    env_file:
      - docker.env

volumes:
  pgdata: